<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathEdu Maroc</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1b3650;font-family:system-ui,Arial,sans-serif}header{background:#13577f;color:white;padding:30px max(20px,calc((100% - 900px)/2))}h1{margin:0}main{max-width:900px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #d5e2ec;border-radius:15px;margin-bottom:16px;padding:24px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;font-weight:bold;margin-bottom:7px}select,input,button{font:inherit;padding:11px;border-radius:8px}select,input{width:100%;border:1px solid #aac0ce}button{background:#136a9b;border:0;color:white;cursor:pointer}button.secondary{background:#455e70}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}ol li{padding:8px}.answer{color:#137551;margin-top:4px}.muted{color:#667b89}@media(max-width:680px){.grid{grid-template-columns:1fr}}@media print{header,.controls{display:none}body{background:white}.panel{border:0;padding:0}}
</style></head>
<body><header><h1>MathEdu Maroc</h1><p>Générateur gratuit d'exercices de mathématiques au collège</p></header>
<main><section class="panel controls"><h2>Préparer une fiche</h2><div class="grid"><div><label for="level">Niveau</label><select id="level"><option value="1">1ère année collège</option><option value="2">2ème année collège</option></select></div><div><label for="topic">Thème</label><select id="topic"><option value="operations">Opérations</option><option value="fractions">Fractions</option><option value="relatifs">Nombres relatifs</option></select></div><div><label for="count">Questions</label><input id="count" type="number" min="1" max="30" value="10"></div></div><div class="actions"><button id="generate">Générer</button><button class="secondary" id="toggle">Afficher la correction</button><button class="secondary" id="print">Imprimer / PDF</button></div></section><section class="panel" id="sheet"><h2>Fiche d'exercices</h2><p class="muted">Choisissez un thème, puis cliquez sur « Générer ».</p></section></main>
<script>
"use strict";
const get=id=>document.getElementById(id);const randint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let questions=[],answersShown=false;
const gcd=(a,b)=>b?gcd(b,a%b):a;
function make(topic){
if(topic==="fractions"){const den=randint(2,12),a=randint(1,9),b=randint(1,9),n=a+b,d=gcd(n,den);return {q:a+"/"+den+" + "+b+"/"+den+" = …",a:(n/d)+"/"+(den/d)}}
if(topic==="relatifs"){const a=randint(-20,20),b=randint(-20,20);return {q:"("+a+") + ("+b+") = …",a:String(a+b)}}
const a=randint(2,25),b=randint(2,25),op=randint(0,3);
if(op===0)return{q:a+" + "+b+" = …",a:String(a+b)};
if(op===1)return{q:a+" − "+b+" = …",a:String(a-b)};
if(op===2)return{q:a+" × "+b+" = …",a:String(a*b)};
return{q:(a*b)+" ÷ "+b+" = …",a:String(a)};
}
function render(){const container=get("sheet");container.replaceChildren();const h=document.createElement("h2");h.textContent="Série d'exercices — "+(get("level").value==="1"?"1ère":"2ème")+" année collège";container.append(h);const info=document.createElement("p");info.textContent="Nom : ____________________    Classe : __________";container.append(info);const ol=document.createElement("ol");for(const item of questions){const li=document.createElement("li");li.append(document.createTextNode(item.q));if(answersShown){const ans=document.createElement("div");ans.className="answer";ans.textContent="Correction : "+item.a;li.append(ans)}ol.append(li)}container.append(ol)}
get("generate").addEventListener("click",()=>{const n=Math.max(1,Math.min(30,Number(get("count").value)||10));get("count").value=n;questions=Array.from({length:n},()=>make(get("topic").value));answersShown=false;get("toggle").textContent="Afficher la correction";render()});
get("toggle").addEventListener("click",()=>{if(!questions.length)return;answersShown=!answersShown;get("toggle").textContent=answersShown?"Masquer la correction":"Afficher la correction";render()});
get("print").addEventListener("click",()=>window.print());
</script></body></html>
